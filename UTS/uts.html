<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log in to your account - rumahkami</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="login-container">
        
        <section class="left-banner" aria-label="Branding Banner">
            <div class="banner-text">
                <h1>Hello,<br>Welcome <span class="highlight">Home!</span></h1>
                <p>Bergabunglah dengan rumahkami! Tempat kamu untuk berinovasi</p>
            </div>
            <img src="image 268.png" alt="Ilustrasi Selamat Datang" class="illustration-img">
        </section>

        <section class="right-form" aria-label="Formulir Autentikasi">
            <div class="form-box">
                
                <div class="brand">
                    <img src="Group 2.png" alt="Logo rumahkami" class="brand-logo-img">
                </div>

                <header class="form-header">
                    <h2>Log in to your account</h2>
                    <p>Enter your email address and password to log in</p>
                </header>

                <form action="#" method="POST">
                    
                    <div class="field-group">
                        <label for="email">Email Address</label>
                        <input type="email" id="email" name="email" placeholder="name@domain.com" required>
                    </div>

                    <div class="field-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" placeholder="••••••••" required>
                    </div>

                    <div class="options-row">
                        <label class="remember-me" for="remember">
                            <input type="checkbox" id="remember" name="remember">
                            <span>Remember me</span>
                        </label>
                        <a href="#" class="forgot-link">Forgot Password?</a>
                    </div>

                    <button type="submit" class="btn-login">Sign In</button>
                </form>

                <div class="divider">
                    <span>or</span>
                </div>

                <button type="button" class="btn-google" aria-label="Sign in with Google">
                    <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
                    </svg>
                    <span>Google</span>
                </button>

                <footer class="form-footer">
                    <p>Don't you have an account? <a href="#">Sign Up</a></p>
                </footer>

            </div>
        </section>

    </main>

</body>
</html>
